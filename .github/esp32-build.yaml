name: ESP32C3 Firmware Build

on:
  # push:
  #   branches: ["**"]
  #   paths:
  #     - "esp32-firmware/**"
  #     - ".github/workflows/esp32-build.yml"
  #   tags: ["esp32-fw/v*"]
  # pull_request:
  #   paths:
  #     - "esp32-firmware/**"
  #     - ".github/workflows/esp32-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: esp32-firmware
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('esp32-firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build
        run: pio run

      - name: Show firmware size
        run: pio run --target size

      - name: Stage release artefacts
        run: |
          mkdir -p artefacts
          cp .pio/build/esp32dev/firmware.bin artefacts/freecut.bin
          cp .pio/build/esp32dev/bootloader.bin artefacts/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin artefacts/partitions.bin

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-fw-${{ github.sha }}
          path: esp32-firmware/artefacts/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/esp32-fw/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esp32-fw-${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ESP32 Firmware ${{ github.ref_name }}"
          files: |
            freecut.bin
            bootloader.bin
            partitions.bin
          generate_release_notes: true